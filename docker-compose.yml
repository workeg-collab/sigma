version: '3.8'

services:
  sigma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma-accounting
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
